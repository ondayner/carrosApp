<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title id="payments-site-title">Cargando...</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- CSS Global -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased bg-main text-main">

    <!-- Contenedor del Navbar -->
    <div id="nav-container" class="w-full z-50"></div>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 py-10 w-full flex-grow">
        <div class="mb-6 text-center md:text-left">
            <span class="text-accent text-xs font-bold uppercase tracking-widest block mb-1">Portal de Cliente</span>
            <h1 class="text-2xl font-extrabold text-main">Gestión de Cuotas y Financiamientos</h1>
            <p class="text-xs text-muted mt-0.5">Revisa el estado de tus cuotas, reporta tus pagos y visualiza los métodos habilitados.</p>
        </div>

        <div id="client-payments-container"></div>
    </main>

    <!-- Contenedor del Footer -->
    <div id="footer-container"></div>

    <!-- Script del Módulo de Pagos -->
    <script type="module">
        import { supabase } from '../js/config/supabase.js';
        import { renderNav } from '../js/components/nav.js';
        import { renderFooter } from '../js/components/footer.js';
        import { renderClientPayments } from '../js/components/clientPayments.js';
        import { companyConfig } from '../js/config/company.js';

        // Configurar título dinámico desde company.js
        const titleEl = document.getElementById('payments-site-title');
        if (titleEl) {
            titleEl.innerText = `${companyConfig.name} - Mis Pagos`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = '../index.html';
                return;
            }
            renderNav(user);
            renderFooter();
            renderClientPayments('client-payments-container', user.id);
        });
    </script>
</body>
</html>
